name: Android CI - OpenCheps APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SF18_TAG: sf_18
      SF18_ARM64_SHA: cc3b3b74466b6d85cdc0f8cfdad4111c6a44bd0698f4eab96fea7b359a54d3d4
      SF18_ARMV7_SHA: 672fbd7533d15fc70dae82df52c1185236975d059a585aa65eda960f1a3266ea

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create diagnostics folder
        shell: bash
        run: |
          mkdir -p ci-output
          {
            echo "OpenCheps Android CI output"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Run: $GITHUB_RUN_NUMBER"
          } > ci-output/BUILD-INFO.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x ./gradlew

      - name: Cache Stockfish 18 binaries
        id: stockfish-cache
        uses: actions/cache@v4
        with:
          path: sf-cache
          key: stockfish-${{ env.SF18_TAG }}-v3

      - name: Download Stockfish 18 Android binaries
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sf-cache
          curl --fail --location --retry 3 --retry-delay 2 \
            -o sf-cache/arm64.tar \
            "https://github.com/official-stockfish/Stockfish/releases/download/${SF18_TAG}/stockfish-android-armv8.tar"
          curl --fail --location --retry 3 --retry-delay 2 \
            -o sf-cache/armv7.tar \
            "https://github.com/official-stockfish/Stockfish/releases/download/${SF18_TAG}/stockfish-android-armv7-neon.tar"
          tar -xf sf-cache/arm64.tar -C sf-cache
          tar -xf sf-cache/armv7.tar -C sf-cache
          mv sf-cache/stockfish/stockfish-android-armv8 sf-cache/libstockfish-arm64.so
          mv sf-cache/stockfish/stockfish-android-armv7-neon sf-cache/libstockfish-armv7.so
          rm -rf sf-cache/stockfish sf-cache/arm64.tar sf-cache/armv7.tar
          ls -lh sf-cache

      - name: Verify Stockfish checksums
        shell: bash
        run: |
          set -euo pipefail
          cd sf-cache
          echo "${SF18_ARM64_SHA} libstockfish-arm64.so" | sha256sum --check -
          echo "${SF18_ARMV7_SHA} libstockfish-armv7.so" | sha256sum --check -

      - name: Install Stockfish into Android jniLibs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          cp sf-cache/libstockfish-arm64.so app/src/main/jniLibs/arm64-v8a/libstockfish.so
          cp sf-cache/libstockfish-armv7.so app/src/main/jniLibs/armeabi-v7a/libstockfish.so
          find app/src/main/jniLibs -type f -maxdepth 3 -exec ls -lh {} \;

      - name: Build debug APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ci-output/gradle-build.log

      - name: Collect APKs and build diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p ci-output
          if [ -d app/build/outputs/apk ]; then
            find app/build/outputs/apk -type f -name '*.apk' -print -exec cp '{}' ci-output/ \;
          fi
          APK_COUNT=$(find ci-output -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')
          {
            echo "APK_COUNT=${APK_COUNT}"
            echo "JOB_STATUS=${{ job.status }}"
            echo "Files collected:"
            find ci-output -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort
          } >> ci-output/BUILD-INFO.txt
          echo "Collected ${APK_COUNT} APK file(s)."
          ls -lah ci-output

      - name: Upload APKs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenCheps-Android-Build
          path: ci-output/
          if-no-files-found: error
          retention-days: 14
